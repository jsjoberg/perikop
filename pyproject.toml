# Python is used only to prepare and check native application resources.
[project]
name = "orthodox-reader-preparation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
voice-prep = [
    "torch==2.13.0",
    "kokoro==0.9.4",
    "transformers==4.51.3",
    "onnx==1.22.0",
    "onnxruntime==1.23.2",
    "huggingface-hub==0.34.4",
    "num2words==0.5.14",
    "soundfile==0.14.0",
    "scipy==1.18.1",
    "numpy==2.5.3",
]

[tool.uv]
package = false
default-groups = []
required-version = ">=0.8.16"
