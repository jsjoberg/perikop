# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Quiet reviews: the CodeRabbit check run shows that a review is running or done,
# and comments appear only for findings.
tone_instructions: "Be terse and plain. One finding per comment. No praise, no emoji, no closing remarks."
chat:
  art: false
reviews:
  high_level_summary: false
  review_status: false
  review_info: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  auto_review:
    # Review every push instead of pausing with a note after five.
    auto_pause_after_reviewed_commits: 0
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
