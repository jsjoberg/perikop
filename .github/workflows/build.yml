name: Native build
on:
  # Other branches, such as Dependabot's, are built by their pull requests.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly checks, publish a prerelease, and keep the latest seven nightlies
        type: boolean
        default: false
  schedule:
    - cron: "15 3 * * *"
      timezone: Europe/Stockholm
permissions:
  contents: read
concurrency:
  # Serialize scheduled and manual nightlies, including publication and cleanup.
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || github.run_id }}
  cancel-in-progress: false
env:
  NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
  # Release packages are built for version tags, manual runs, and nightlies.
  PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
jobs:
  nightly:
    if: github.event_name == 'schedule' || inputs.nightly == true
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.changes.outputs.build }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - name: Check for changes since the last successful nightly
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          latest=$(jq -r '
             [.[][] | select(.draft == false and .prerelease == true)
              | select(.tag_name | test("^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9a-f]{7}(-[0-9]+(-[0-9]+)?)?)?$"))
              | select(((.body // "") | contains("<!-- perikop-nightly: partial -->")) | not)
              | select([.assets[]? | select(.name | test("^releases\\.(linux-(x64|arm64)|win-x64|osx-arm64)-nightly\\.json$"))] | length == 4)]
            | sort_by(.published_at, .tag_name) | last | .tag_name // empty
          ' releases.json)
          if [ -n "$latest" ]; then
            previous=$(gh api "repos/$GITHUB_REPOSITORY/commits/$latest" --jq '.sha')
            if [ "$previous" = "$GITHUB_SHA" ]; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              echo "No changes since $latest; skipping the nightly build." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
      - name: Choose the nightly's version
        id: version
        if: steps.changes.outputs.build == 'true'
        run: |
          set -euo pipefail
          base=$(sed -n 's/^project(perikop VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          released=$(jq --arg tag "v$base" '[.[][] | select(.draft == false and .tag_name == $tag)] | length' releases.json)
          released_flag=
          [ "$released" = 0 ] || released_flag=--released
          version=$(python3 tools/ci/nightly.py version --base "$base" $released_flag \
            --date "$(TZ=Europe/Stockholm date +%F)" --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Nightly version $version" >> "$GITHUB_STEP_SUMMARY"
  unix:
    needs: [nightly]
    if: ${{ !cancelled() && ((github.event_name != 'schedule' && !inputs.nightly) || needs.nightly.outputs.build == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: Linux}
          # The Raspberry Pi 5 package, for 64-bit Raspberry Pi OS.
          - {os: ubuntu-24.04-arm, platform: Linux-arm64}
          - {os: macos-15, platform: macOS-arm64, dependencies: macOS, architecture: arm64}
    runs-on: ${{ matrix.os }}
    env:
      PLATFORM: ${{ matrix.platform }}
      PERIKOP_BUILD_VERSION: ${{ needs.nightly.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - name: Cached dependency snapshots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/downloads
          key: dependencies-${{ matrix.dependencies || matrix.platform }}-${{ hashFiles('ci/dependencies-lock.json') }}
      - name: Restore verified dependencies from this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dependencies.py restore --platform "${{ matrix.dependencies || matrix.platform }}"
      - name: Restore verified previous update package
        if: env.PACKAGE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/update_packages.py restore --platform "$PLATFORM"
      - name: Compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: objects-${{ matrix.platform }}-${{ hashFiles('ci/upstreams.json') }}-${{ github.sha }}
          restore-keys: |
            objects-${{ matrix.platform }}-${{ hashFiles('ci/upstreams.json') }}-
            objects-${{ matrix.platform }}-${{ hashFiles('ci/dependencies-lock.json') }}-
            objects-${{ matrix.platform }}-
      - name: Build, analyze, test, and package Linux offline
        if: runner.os == 'Linux'
        run: |
          docker load --input "build/ci/downloads/$PLATFORM-environment.tar.gz"
          docker run --rm --pull never --network none -v "$PWD:/work" \
            -v "${{ steps.python.outputs.root }}:/opt/perikop-python:ro" \
            -e PATH="/opt/perikop-python/bin:/opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -e PACKAGE -e NIGHTLY -e PERIKOP_BUILD_VERSION \
            perikop-ci-linux:dependencies python3 tools/ci/build.py linux
      - name: Build, analyze, test, and package macOS offline
        if: runner.os == 'macOS'
        run: sandbox-exec -p '(version 1)(allow default)(deny network*)' python3 tools/ci/build.py macos
      - name: Save compiler cache after build or check failure
        if: always() && !cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload macOS update validation kit
        if: runner.os == 'macOS' && (env.PACKAGE == 'true' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-update-validation-${{ matrix.architecture }}
          path: build/macos-update-validation-${{ matrix.architecture }}.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.platform }}
          path: build/smoke
          if-no-files-found: ignore
      - name: Upload package
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perikop-${{ matrix.platform }}
          retention-days: ${{ env.NIGHTLY == 'true' && 1 || 0 }}
          path: build/publish
          if-no-files-found: error
          compression-level: 0
  windows-build:
    needs: [nightly]
    if: ${{ !cancelled() && ((github.event_name != 'schedule' && !inputs.nightly) || needs.nightly.outputs.build == 'true') }}
    runs-on: ubuntu-24.04
    env:
      PERIKOP_BUILD_VERSION: ${{ needs.nightly.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - name: Cached dependency snapshots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/downloads
          key: dependencies-Windows-cross-${{ hashFiles('ci/dependencies-lock.json') }}
      - name: Restore verified Windows sources and Linux toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dependencies.py restore --platform Windows --cross
      - name: Compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: objects-Windows-cross-${{ hashFiles('ci/upstreams.json', 'ci/windows-cross.Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            objects-Windows-cross-${{ hashFiles('ci/upstreams.json', 'ci/windows-cross.Dockerfile') }}-
            objects-Windows-cross-
      - name: Compile Windows x64 offline on Linux
        run: |
          docker load --input build/ci/downloads/Windows-cross-environment.tar.gz
          docker run --rm --pull never --network none -v "$PWD:/work" \
            -v "${{ steps.python.outputs.root }}:/opt/perikop-python:ro" \
            -e PATH="/opt/perikop-python/bin:/opt/llvm-mingw/bin:/usr/local/bin:/usr/bin:/bin" \
            -e PERIKOP_BUILD_VERSION \
            perikop-ci-windows-cross:dependencies python3 tools/ci/build.py windows
      - name: Save compiler cache after build failure
        if: always() && !cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Transfer binaries to Windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-build
          path: build/windows-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  windows:
    needs: [nightly, windows-build]
    if: ${{ !cancelled() && needs.windows-build.result == 'success' && ((github.event_name != 'schedule' && !inputs.nightly) || needs.nightly.outputs.build == 'true') }}
    runs-on: windows-2025
    env:
      PERIKOP_BUILD_VERSION: ${{ needs.nightly.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - name: Cached dependency snapshots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/downloads
          key: dependencies-${{ runner.os }}-${{ hashFiles('ci/dependencies-lock.json') }}
      - name: Restore verified dependencies from this repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci/dependencies.py restore --platform Windows --tools-only
          if ($LASTEXITCODE -ne 0) { throw 'Dependency snapshot restore failed' }
      - name: Restore verified previous update package
        if: env.PACKAGE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/update_packages.py restore --platform Windows
      - name: Download cross-built binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-build
          path: build/cross
      - name: Restore cross-built binaries without recompiling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/cmake | Out-Null
          tar -xzf build/cross/windows-x64.tar.gz -C build/cmake
          if ($LASTEXITCODE -ne 0) { throw 'Cross-built binary restore failed' }
      - name: Configure native test paths and installation
        shell: pwsh
        run: |
          # The prebuilt project needs no compiler or native sources.
          cmake -S cmake/windows-prebuilt -B build/cmake -G Ninja
          if ($LASTEXITCODE -ne 0) { throw 'Windows configuration failed' }
      - name: Windows version and icon resources
        shell: pwsh
        run: |
          $header = Get-Content build/cmake/generated/perikop_version.hpp -Raw
          if ($header -notmatch '#define PERIKOP_VERSION "([^"]+)"') { throw 'Build version missing' }
          $expected = $Matches[1]
          $version = (Get-Item build/cmake/bin/perikop.exe).VersionInfo
          if ($version.FileDescription -ne 'Perikop' -or $version.ProductName -ne 'Perikop') {
            throw 'Executable must be named Perikop in Task Manager and file properties'
          }
          if ($version.ProductVersion -ne $expected -or $version.FileVersion -ne $expected) {
            throw "Executable version does not match $expected"
          }
          if (Test-Path build/cmake/bin/resources/icons) { throw 'Icon resources should be embedded' }
      - run: ctest --test-dir build/cmake --output-on-failure
      - name: Smoke test screenshots
        timeout-minutes: 10
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/smoke | Out-Null
          & build/cmake/bin/perikop.exe --smoke-test --resources build/cmake/bin/resources --screenshot "$PWD/build/smoke/reader.png" | Out-Host
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ runner.os }}
          path: build/smoke
          if-no-files-found: ignore
      - name: Package
        # PRs also install, update, and uninstall with Velopack.
        if: env.PACKAGE == 'true' || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $header = Get-Content build/cmake/generated/perikop_version.hpp -Raw
          if ($header -notmatch '#define PERIKOP_VERSION "([^"]+)"') { throw 'Build version missing' }
          $expected = $Matches[1]
          # Velopack: install the files with Setup.exe, update them from a local feed, and uninstall.
          cmake --install build/cmake --prefix build/stage
          if ($LASTEXITCODE -ne 0) { throw 'Staging the installed files failed' }
          python tools/ci/velopack_windows_test.py build/stage/bin
          if ($LASTEXITCODE -ne 0) { throw 'Velopack install, update, and uninstall failed' }
          if ($env:PACKAGE -eq 'true') {
            $track = if ($env:NIGHTLY -eq 'true') { 'nightly' } else { 'releases' }
            $channel = "win-x64-$track"
            $output = "build/velopack/$channel"
            python tools/ci/update_packages.py seed "build/update-base/$channel" $output
            if ($LASTEXITCODE -ne 0) { throw 'Preparing the delta base failed' }
            dotnet build/ci/tools/vpk/tools/net8.0/any/vpk.dll pack --packId Perikop --packTitle Perikop `
              --packVersion $expected --packDir build/stage/bin --mainExe perikop.exe `
              --runtime win-x64 --channel $channel --delta BestSpeed --outputDir $output
            if ($LASTEXITCODE -ne 0) { throw 'Velopack packaging failed' }
            python tools/ci/update_packages.py finish $output $channel $expected build/publish/updates
            if ($LASTEXITCODE -ne 0) { throw 'Collecting update packages failed' }
          }
      - name: Upload package
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perikop-Windows
          retention-days: ${{ env.NIGHTLY == 'true' && 1 || 0 }}
          path: build/publish
          if-no-files-found: error
  sanitizers:
    needs: [nightly]
    if: ${{ !cancelled() && ((github.event_name != 'schedule' && !inputs.nightly) || needs.nightly.outputs.build == 'true') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - name: Cached dependency snapshots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/downloads
          key: dependencies-macOS-${{ hashFiles('ci/dependencies-lock.json') }}
      - name: Restore verified dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dependencies.py restore --platform macOS
      - name: Storage, speech, layout, and UI with ASan and UBSan
        timeout-minutes: 30
        run: sandbox-exec -p '(version 1)(allow default)(deny network*)' python3 tools/ci/build.py sanitizers
  linux-sanitizers:
    needs: [nightly]
    if: ${{ !cancelled() && ((github.event_name != 'schedule' && !inputs.nightly) || needs.nightly.outputs.build == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - name: Cached dependency snapshots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/downloads
          key: dependencies-Linux-${{ hashFiles('ci/dependencies-lock.json') }}
      - name: Restore verified dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dependencies.py restore --platform Linux
      - name: Storage, speech, layout, and UI with ASan, UBSan, and LeakSanitizer
        timeout-minutes: 40
        run: |
          docker load --input build/ci/downloads/Linux-environment.tar.gz
          docker run --rm --pull never --network none -v "$PWD:/work" \
            -v "${{ steps.python.outputs.root }}:/opt/perikop-python:ro" \
            -e PATH="/opt/perikop-python/bin:/opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            perikop-ci-linux:dependencies python3 tools/ci/build.py linux-sanitizers
  publication-check:
    needs: [unix, windows, sanitizers, linux-sanitizers]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.nightly && needs.unix.result == 'success' && needs.windows.result == 'success' && needs.sanitizers.result == 'success' && needs.linux-sanitizers.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perikop-*
          path: packages
          merge-multiple: true
      - name: Verify the complete unpublished release staging
        run: |
          version=$(python3 tools/ci/update_packages.py version)
          python3 tools/ci/update_packages.py assemble packages/updates build/release-check "$version" --complete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-check
          path: |
            build/release-check/SHA256SUMS.txt
            build/release-check/releases.*.json
          if-no-files-found: error
  release:
    # Version tags require every check. Nightlies retain each successful platform package.
    if: ${{ !cancelled() && ((startsWith(github.ref, 'refs/tags/v') && needs.unix.result == 'success' && needs.windows.result == 'success' && needs.sanitizers.result == 'success' && needs.linux-sanitizers.result == 'success') || (!startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'schedule' || inputs.nightly == true) && needs.nightly.outputs.build == 'true')) }}
    needs: [nightly, unix, windows, sanitizers, linux-sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perikop-*
          path: packages
          merge-multiple: true
      - name: Stage and publish native packages and update feeds
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SANITIZERS: ${{ needs.sanitizers.result }}
          LINUX_SANITIZERS: ${{ needs.linux-sanitizers.result }}
          BUILD_VERSION: ${{ needs.nightly.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p packages/updates
          complete=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
            version=${tag#v}
            base=${version%%-*}
            project=$(sed -n 's/^project(perikop VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
            if [ "$project" != "$base" ]; then
              echo "::error::Tag $tag does not match version $project in CMakeLists.txt."
              exit 1
            fi
            source="https://github.com/$GITHUB_REPOSITORY/blob/$tag"
            echo "See [the changes]($source/CHANGELOG.md) and [installation]($source/docs/using-perikop.md#installation)." > notes.md
            options=(--verify-tag --draft --title "Perikop $version")
            complete=(--complete)
          else
            day=$(TZ=Europe/Stockholm date +%F)
            tag="nightly-$day-${GITHUB_SHA:0:7}"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              tag="$tag-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            fi
            version=$BUILD_VERSION
            tag=$(python3 tools/ci/nightly.py prepare --updates packages/updates --notes notes.md \
              --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --tag "$tag" \
              --macos-sanitizers "$MACOS_SANITIZERS" --linux-sanitizers "$LINUX_SANITIZERS" --version "$version")
            if [ -z "$tag" ]; then
              echo 'No successful platform packages; no nightly was published.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            options=(--target "$GITHUB_SHA" --prerelease --latest=false --title "Perikop nightly $day")
          fi
          python3 tools/ci/update_packages.py assemble packages/updates release-assets "$version" "${complete[@]}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" "${options[@]}" --notes-file notes.md release-assets/*
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Preserve referenced packages and keep the latest seven nightlies
        if: env.NIGHTLY == 'true' && steps.publish.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.publish.outputs.tag }}
        run: python3 tools/ci/update_packages.py cleanup --repository "$GITHUB_REPOSITORY" --current "$NIGHTLY_TAG" --keep 7
