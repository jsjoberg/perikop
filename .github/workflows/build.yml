name: Native build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Release packages are built for version tags and manual runs.
  PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
  # The prepared voice pack is a release asset of this repository; see docs/releasing.md.
  VOICE_PACK: kokoro-sv-alice-bjorn-2c7968d-v1
  VOICE_PACK_SHA256: a8a7aefb95bb01f8090b3aa2ea0fbdf8264e16d68518bdf090f4bdf72807a472
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux toolkit headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-13 libgtk-3-dev libfontconfig1-dev xvfb dpkg-dev
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.os }}
          max-size: 2G
      - name: Voice pack
        if: env.PACKAGE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VOICE_PACK" --repo "$GITHUB_REPOSITORY" --pattern "$VOICE_PACK.tar.gz" --dir build
          test "$(cmake -E sha256sum "build/$VOICE_PACK.tar.gz" | cut -d ' ' -f 1)" = "$VOICE_PACK_SHA256"
          mkdir -p build/kokoro-pack
          tar -xzf "build/$VOICE_PACK.tar.gz" -C build/kokoro-pack
      - name: Install clang-tidy
        if: runner.os == 'macOS'
        run: brew install llvm
      - name: Configure
        shell: bash
        run: |
          # ccache cannot reuse precompiled headers, so wxWidgets builds without them in CI.
          cache="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DwxBUILD_PRECOMP=OFF"
          if [ "$RUNNER_OS" = Linux ]; then
            cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13 $cache
          else
            llvm="$(brew --prefix llvm)/bin"
            cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release $cache \
              "-DORTHO_CLANG_TIDY=$llvm/clang-tidy" "-DORTHO_RUN_CLANG_TIDY=$llvm/run-clang-tidy"
          fi
      - run: cmake --build build/cmake --parallel 3
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a ctest --test-dir build/cmake --output-on-failure
          else
            ctest --test-dir build/cmake --output-on-failure
          fi
      - name: Smoke test backtrace
        timeout-minutes: 10
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get install -y gdb
          mkdir -p build/smoke
          xvfb-run -a gdb -batch -ex run -ex bt --args build/cmake/bin/perikop --smoke-test \
            --resources build/cmake/bin/resources --screenshot "$PWD/build/smoke/reader.png"
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ runner.os }}
          path: build/smoke
          if-no-files-found: ignore
      - name: Static analysis
        # Ubuntu's clang-tidy 18 cannot read the C++23 headers of GCC 13 or 14.
        if: runner.os == 'macOS'
        run: cmake --build build/cmake --target tidy
      - name: Install preparation tools
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.16"
      - run: uv run --locked tools/check_resources.py
      - name: Package
        if: env.PACKAGE == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            tools/package_appimage.sh build/cmake
          else
            # hdiutil on hosted runners sometimes fails with "Resource busy"; try again.
            for attempt in 1 2 3; do
              cpack --config build/cmake/CPackConfig.cmake -B build/package && break
              [ "$attempt" = 3 ] && exit 1
              sleep 15
            done
          fi
      - name: Upload package
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perikop-${{ runner.os }}
          path: build/package/Perikop-*
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned w64devkit
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'w64devkit.7z.exe'
          Invoke-WebRequest 'https://github.com/skeeto/w64devkit/releases/download/v2.10.0/w64devkit-x64-2.10.0.7z.exe' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '18d0a4c71a166f8401ab6305781bec5882b40b5e06ba9807c61cb5f3b3c6325e') { throw 'w64devkit hash mismatch' }
          $toolchain = Join-Path $env:RUNNER_TEMP 'toolchain'
          & 7z x $archive "-o$toolchain" -y
          if ($LASTEXITCODE -ne 0) { throw 'w64devkit extraction failed' }
          $bin = Join-Path $toolchain 'w64devkit/bin'
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ORTHO_TOOLCHAIN_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: windows
          max-size: 2G
      - name: Voice pack
        if: env.PACKAGE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VOICE_PACK" --repo "$GITHUB_REPOSITORY" --pattern "$VOICE_PACK.tar.gz" --dir build
          test "$(cmake -E sha256sum "build/$VOICE_PACK.tar.gz" | cut -d ' ' -f 1)" = "$VOICE_PACK_SHA256"
          mkdir -p build/kokoro-pack
          tar -xzf "build/$VOICE_PACK.tar.gz" -C build/kokoro-pack
      - name: Configure
        shell: pwsh
        run: |
          # onnxruntime.dll needs the Visual C++ runtime; the installer carries it beside the DLL.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $runtime = & $vswhere -latest -find 'VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\vcruntime140_1.dll' | Sort-Object | Select-Object -Last 1
          if (-not $runtime) { throw 'Visual C++ runtime not found' }
          cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=$env:ORTHO_TOOLCHAIN_BIN/gcc.exe" "-DCMAKE_CXX_COMPILER=$env:ORTHO_TOOLCHAIN_BIN/g++.exe" "-DPERIKOP_MSVC_RUNTIME=$(Split-Path $runtime)" `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DwxBUILD_PRECOMP=OFF
      - run: cmake --build build/cmake --parallel 4
      - run: ctest --test-dir build/cmake --output-on-failure
      - name: Smoke test screenshots
        timeout-minutes: 10
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/smoke | Out-Null
          & build/cmake/bin/perikop.exe --smoke-test --resources build/cmake/bin/resources --screenshot "$PWD/build/smoke/reader.png" | Out-Host
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ runner.os }}
          path: build/smoke
          if-no-files-found: ignore
      - name: Install preparation tools
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.16"
      - run: uv run --locked tools/check_resources.py
      - name: Package
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          choco install nsis --version=3.11.0 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          $env:PATH = "${env:ProgramFiles(x86)}\NSIS;$env:PATH"
          cpack --config build/cmake/CPackConfig.cmake -B build/package
      - name: Upload package
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perikop-Windows
          path: build/package/Perikop-*.exe
          if-no-files-found: error
  release:
    # A version tag becomes a draft release with all three packages; publish it on GitHub.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perikop-*
          path: packages
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          version=${GITHUB_REF_NAME#v}
          base=${version%%-*}
          # The packages carry the version from CMakeLists.txt, which must match the tag.
          shopt -s nullglob
          files=(Perikop-"$base"-*)
          if [ "${#files[@]}" != 3 ]; then
            echo "::error::The packages are not version $base. Set that version in CMakeLists.txt."
            exit 1
          fi
          if [ "$version" != "$base" ]; then
            for file in "${files[@]}"; do
              mv "$file" "Perikop-$version-${file#Perikop-"$base"-}"
            done
          fi
          sha256sum Perikop-* > SHA256SUMS.txt
          source="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Perikop $version" \
            --notes "See [the changes]($source/CHANGELOG.md) and [installation]($source/docs/using-perikop.md#installation)." \
            Perikop-* SHA256SUMS.txt
