name: Native build
on:
  # Other branches, such as Dependabot's, are built by their pull requests.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly checks, publish a prerelease, and keep the latest seven nightlies
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * *"
      timezone: Europe/Stockholm
permissions:
  contents: read
concurrency:
  # Serialize scheduled and manual nightlies, including publication and cleanup.
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || github.run_id }}
  cancel-in-progress: false
env:
  NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
  # Release packages are built for version tags, manual runs, and nightlies.
  PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
jobs:
  nightly:
    if: github.event_name == 'schedule' || inputs.nightly == true
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - name: Check for changes since the last successful nightly
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          latest=$(jq -r '
            [.[][] | select(.draft == false and .prerelease == true)
              | select(.tag_name | test("^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))]
            | sort_by(.published_at, .tag_name) | last | .tag_name // empty
          ' releases.json)
          if [ -n "$latest" ]; then
            previous=$(gh api "repos/$GITHUB_REPOSITORY/commits/$latest" --jq '.sha')
            if [ "$previous" = "$GITHUB_SHA" ]; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              echo "No changes since $latest; skipping the nightly build." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
  unix:
    needs: [nightly]
    if: ${{ !cancelled() && ((github.event_name != 'schedule' && !inputs.nightly) || needs.nightly.outputs.build == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cached dependency snapshots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/downloads
          key: dependencies-${{ runner.os }}-${{ hashFiles('ci/dependencies-lock.json') }}
      - name: Restore verified dependencies from this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          [ "$PACKAGE" != true ] || args+=(--package)
          python3 tools/ci/dependencies.py restore --platform "$RUNNER_OS" "${args[@]}"
      - name: Compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: objects-${{ runner.os }}-${{ hashFiles('ci/upstreams.json') }}-${{ github.sha }}
          restore-keys: |
            objects-${{ runner.os }}-${{ hashFiles('ci/upstreams.json') }}-
            objects-${{ runner.os }}-${{ hashFiles('ci/dependencies-lock.json') }}-
      - name: Build, test, and package Linux offline
        if: runner.os == 'Linux'
        run: |
          docker load --input build/ci/downloads/Linux-environment.tar.gz
          docker run --rm --pull never --network none -v "$PWD:/work" -e PACKAGE \
            perikop-ci-linux:dependencies bash tools/ci/build-linux.sh
      - name: Build, analyze, test, and package macOS offline
        if: runner.os == 'macOS'
        run: sandbox-exec -p '(version 1)(allow default)(deny network*)' bash tools/ci/build-macos.sh
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ runner.os }}
          path: build/smoke
          if-no-files-found: ignore
      - name: Upload package
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perikop-${{ runner.os }}
          retention-days: ${{ env.NIGHTLY == 'true' && 1 || 0 }}
          path: build/package/Perikop-*
          if-no-files-found: error
          compression-level: 0
  windows:
    needs: [nightly]
    if: ${{ !cancelled() && ((github.event_name != 'schedule' && !inputs.nightly) || needs.nightly.outputs.build == 'true') }}
    runs-on: windows-2025
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cached dependency snapshots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/downloads
          key: dependencies-${{ runner.os }}-${{ hashFiles('ci/dependencies-lock.json') }}
      - name: Restore verified dependencies from this repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $options = @()
          if ($env:PACKAGE -eq 'true') { $options += '--package' }
          python tools/ci/dependencies.py restore --platform Windows @options
          if ($LASTEXITCODE -ne 0) { throw 'Dependency snapshot restore failed' }
          $bin = Join-Path $PWD 'build/ci/tools/w64devkit/bin'
          $gccVersion = & (Join-Path $bin 'g++.exe') -dumpfullversion -dumpversion
          if ($LASTEXITCODE -ne 0 -or $gccVersion -ne '15.2.0') { throw "Expected GCC 15.2.0, got $gccVersion" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $PWD 'build/ci/tools/ccache') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $PWD 'build/ci/tools/nsis') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ORTHO_TOOLCHAIN_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NSISDIR=$(Join-Path $PWD 'build/ci/tools/nsis')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: objects-${{ runner.os }}-${{ hashFiles('ci/upstreams.json') }}-${{ github.sha }}
          restore-keys: |
            objects-${{ runner.os }}-${{ hashFiles('ci/upstreams.json') }}-
            objects-${{ runner.os }}-${{ hashFiles('ci/dependencies-lock.json') }}-
      - name: Configure
        shell: pwsh
        run: |
          # onnxruntime.dll needs the Visual C++ runtime; the installer carries it beside the DLL.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $runtime = & $vswhere -latest -find 'VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\vcruntime140_1.dll' | Sort-Object | Select-Object -Last 1
          if (-not $runtime) { throw 'Visual C++ runtime not found' }
          cmake -S . -B build/cmake -G Ninja "-DPERIKOP_DEPENDENCY_DIR=$PWD/build/ci/sources" "-DCMAKE_C_COMPILER=$env:ORTHO_TOOLCHAIN_BIN/gcc.exe" "-DCMAKE_CXX_COMPILER=$env:ORTHO_TOOLCHAIN_BIN/g++.exe" "-DPERIKOP_MSVC_RUNTIME=$(Split-Path $runtime)" `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DwxBUILD_PRECOMP=OFF
      - run: cmake --build build/cmake --parallel 4
      - name: Windows version and icon resources
        shell: pwsh
        run: |
          $header = Get-Content build/cmake/generated/perikop_version.hpp -Raw
          if ($header -notmatch '#define PERIKOP_VERSION "([^"]+)"') { throw 'Build version missing' }
          $expected = $Matches[1]
          $version = (Get-Item build/cmake/bin/perikop.exe).VersionInfo
          if ($version.FileDescription -ne 'Perikop' -or $version.ProductName -ne 'Perikop') {
            throw 'Executable must be named Perikop in Task Manager and file properties'
          }
          if ($version.ProductVersion -ne $expected -or $version.FileVersion -ne $expected) {
            throw "Executable version does not match $expected"
          }
          if (Test-Path build/cmake/bin/resources/icons) { throw 'Icon resources should be embedded' }
      - run: ctest --test-dir build/cmake --output-on-failure
      - name: Smoke test screenshots
        timeout-minutes: 10
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/smoke | Out-Null
          & build/cmake/bin/perikop.exe --smoke-test --resources build/cmake/bin/resources --screenshot "$PWD/build/smoke/reader.png" | Out-Host
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ runner.os }}
          path: build/smoke
          if-no-files-found: ignore
      - run: python tools/check_resources.py
      - run: python tests/icon_test.py
      - run: python tests/linux_abi_test.py
      - run: python tests/ci_dependencies_test.py
      - name: Package
        # PRs also compile the installer and check its Windows product-version metadata.
        if: env.PACKAGE == 'true' || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          cpack --config build/cmake/CPackConfig.cmake -B build/package
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          $script = Get-Content build/package/_CPack_Packages/windows-x64/NSIS/project.nsi -Raw
          $languages = [regex]::Matches($script, '!insertmacro MUI_LANGUAGE "([^"]+)"')
          if ($languages.Count -ne 1 -or $languages[0].Groups[1].Value -ne 'Swedish') {
            throw 'Installer must include only the Swedish language'
          }
          $header = Get-Content build/cmake/generated/perikop_version.hpp -Raw
          if ($header -notmatch '#define PERIKOP_VERSION "([^"]+)"') { throw 'Build version missing' }
          $expected = $Matches[1]
          $installer = Get-ChildItem build/package/Perikop-*.exe | Select-Object -First 1
          if (-not $installer -or $installer.VersionInfo.ProductVersion -ne $expected) {
            throw "Installer version does not match $expected"
          }
      - name: Upload package
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perikop-Windows
          retention-days: ${{ env.NIGHTLY == 'true' && 1 || 0 }}
          path: build/package/Perikop-*.exe
          if-no-files-found: error
  release:
    # Version tags become drafts. Nightlies publish only after all three platforms pass.
    if: ${{ !cancelled() && needs.unix.result == 'success' && needs.windows.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || inputs.nightly == true) }}
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perikop-*
          path: packages
          merge-multiple: true
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          version=${GITHUB_REF_NAME#v}
          base=${version%%-*}
          # The packages carry the version from CMakeLists.txt, which must match the tag.
          shopt -s nullglob
          files=(Perikop-"$base"-*)
          if [ "${#files[@]}" != 3 ]; then
            echo "::error::The packages are not version $base. Set that version in CMakeLists.txt."
            exit 1
          fi
          if [ "$version" != "$base" ]; then
            for file in "${files[@]}"; do
              mv "$file" "Perikop-$version-${file#Perikop-"$base"-}"
            done
          fi
          sha256sum Perikop-* > SHA256SUMS.txt
          source="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Perikop $version" \
            --notes "See [the changes]($source/CHANGELOG.md) and [installation]($source/docs/using-perikop.md#installation)." \
            Perikop-* SHA256SUMS.txt
      - name: Publish nightly prerelease
        id: nightly
        if: env.NIGHTLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd packages
          day=$(TZ=Europe/Stockholm date +%F)
          tag="nightly-$day"
          shopt -s nullglob
          files=(Perikop-*)
          if [ "${#files[@]}" != 3 ]; then
            echo "::error::The nightly needs all three platform packages."
            exit 1
          fi
          base=${files[0]#Perikop-}
          base=${base%%-*}
          for file in "${files[@]}"; do
            if [[ "$file" != Perikop-"$base"-* ]]; then
              echo "::error::The nightly packages have different versions."
              exit 1
            fi
            mv "$file" "Perikop-$tag-${file#Perikop-"$base"-}"
          done
          sha256sum Perikop-* > SHA256SUMS.txt
          source="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
          run="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Perikop nightly $day" \
            --notes "Nightly build of commit $GITHUB_SHA. See [the build]($run), [the changes]($source/CHANGELOG.md), and [installation]($source/docs/using-perikop.md#installation)." \
            Perikop-* SHA256SUMS.txt
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Keep the latest seven nightly releases
        if: env.NIGHTLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.nightly.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          jq -r --arg current "$NIGHTLY_TAG" '
            [.[][] | select(.draft == false and .prerelease == true)
              | select(.tag_name | test("^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))]
            | if any(.tag_name == $current) then
                sort_by(.published_at, .tag_name) | reverse | .[7:] | .[].tag_name
              else error("Published nightly is missing; cleanup stopped") end
          ' releases.json > obsolete.txt
          while IFS= read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < obsolete.txt
