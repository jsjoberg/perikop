name: Native build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux toolkit headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-13 libgtk-3-dev libfontconfig1-dev xvfb
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          else
            cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release
          fi
      - run: cmake --build build/cmake --parallel 3
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a ctest --test-dir build/cmake --output-on-failure
          else
            ctest --test-dir build/cmake --output-on-failure
          fi
      - run: python3 tools/check_resources.py
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned w64devkit
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'w64devkit.7z.exe'
          Invoke-WebRequest 'https://github.com/skeeto/w64devkit/releases/download/v2.10.0/w64devkit-x64-2.10.0.7z.exe' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '18d0a4c71a166f8401ab6305781bec5882b40b5e06ba9807c61cb5f3b3c6325e') { throw 'w64devkit hash mismatch' }
          $toolchain = Join-Path $env:RUNNER_TEMP 'toolchain'
          & 7z x $archive "-o$toolchain" -y
          if ($LASTEXITCODE -ne 0) { throw 'w64devkit extraction failed' }
          $bin = Join-Path $toolchain 'w64devkit/bin'
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ORTHO_TOOLCHAIN_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=$env:ORTHO_TOOLCHAIN_BIN/gcc.exe" "-DCMAKE_CXX_COMPILER=$env:ORTHO_TOOLCHAIN_BIN/g++.exe"
      - run: cmake --build build/cmake --parallel 3
      - run: ctest --test-dir build/cmake --output-on-failure
      - run: python tools/check_resources.py
