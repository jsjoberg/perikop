name: Native build
on:
  # Other branches, such as Dependabot's, are built by their pull requests.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly checks, publish a prerelease, and keep the latest seven nightlies
        type: boolean
        default: false
  schedule:
    - cron: "15 3 * * *"
      timezone: Europe/Stockholm
permissions:
  contents: read
concurrency:
  # Serialize scheduled and manual nightlies, including publication and cleanup.
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || github.run_id }}
  cancel-in-progress: false
env:
  NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
  # Release packages are built for version tags, manual runs, and nightlies.
  PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
jobs:
  nightly:
    if: github.event_name == 'schedule' || inputs.nightly == true
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.changes.outputs.build }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for changes since the last successful nightly
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          latest=$(jq -r '
             [.[][] | select(.draft == false and .prerelease == true)
              | select(.tag_name | test("^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9a-f]{7}(-[0-9]+(-[0-9]+)?)?)?$"))
              | select(((.body // "") | contains("<!-- perikop-nightly: partial -->")) | not)
              | select([.assets[]? | select(.name | startswith("Perikop-"))] | length == 5)]
            | sort_by(.published_at, .tag_name) | last | .tag_name // empty
          ' releases.json)
          if [ -n "$latest" ]; then
            previous=$(gh api "repos/$GITHUB_REPOSITORY/commits/$latest" --jq '.sha')
            if [ "$previous" = "$GITHUB_SHA" ]; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              echo "No changes since $latest; skipping the nightly build." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
      - name: Choose the nightly's version
        id: version
        if: steps.changes.outputs.build == 'true'
        run: |
          set -euo pipefail
          base=$(sed -n 's/^project(perikop VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          released=$(jq --arg tag "v$base" '[.[][] | select(.draft == false and .tag_name == $tag)] | length' releases.json)
          released_flag=
          [ "$released" = 0 ] || released_flag=--released
          version=$(python3 tools/ci/nightly.py version --base "$base" $released_flag \
            --date "$(TZ=Europe/Stockholm date +%F)" --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Nightly version $version" >> "$GITHUB_STEP_SUMMARY"
  unix:
    needs: [nightly]
    if: ${{ !cancelled() && ((github.event_name != 'schedule' && !inputs.nightly) || needs.nightly.outputs.build == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: Linux}
          # The Raspberry Pi 5 package, for 64-bit Raspberry Pi OS.
          - {os: ubuntu-24.04-arm, platform: Linux-arm64}
          - {os: macos-15, platform: macOS-arm64, dependencies: macOS, architecture: arm64}
          # Build Intel separately and run its tests through Rosetta on the ARM runner.
          - {os: macos-15, platform: macOS-x86_64, dependencies: macOS, architecture: x86_64}
    runs-on: ${{ matrix.os }}
    env:
      PLATFORM: ${{ matrix.platform }}
      MACOS_ARCH: ${{ matrix.architecture }}
      PERIKOP_BUILD_VERSION: ${{ needs.nightly.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cached dependency snapshots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/downloads
          key: dependencies-${{ matrix.dependencies || matrix.platform }}-${{ hashFiles('ci/dependencies-lock.json') }}
      - name: Restore verified dependencies from this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "$PACKAGE" = true ] || { [ "$RUNNER_OS" = macOS ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; }; then
            args+=(--package)
          fi
          python3 tools/ci/dependencies.py restore --platform "${{ matrix.dependencies || matrix.platform }}" "${args[@]}"
      - name: Compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: objects-${{ matrix.platform }}-${{ hashFiles('ci/upstreams.json') }}-${{ github.sha }}
          restore-keys: |
            objects-${{ matrix.platform }}-${{ hashFiles('ci/upstreams.json') }}-
            objects-${{ matrix.platform }}-${{ hashFiles('ci/dependencies-lock.json') }}-
            objects-${{ matrix.platform }}-
      - name: Build, test, and package Linux offline
        if: runner.os == 'Linux'
        run: |
          docker load --input "build/ci/downloads/$PLATFORM-environment.tar.gz"
          docker run --rm --pull never --network none -v "$PWD:/work" -e PACKAGE -e PERIKOP_BUILD_VERSION \
            perikop-ci-linux:dependencies bash tools/ci/build-linux.sh
      - name: Build, analyze, test, and package macOS offline
        if: runner.os == 'macOS'
        run: sandbox-exec -p '(version 1)(allow default)(deny network*)' bash tools/ci/build-macos.sh
      - name: Save compiler cache after build or check failure
        if: always() && !cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload macOS update validation kit
        if: runner.os == 'macOS' && (env.PACKAGE == 'true' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-update-validation-${{ matrix.architecture }}
          path: build/macos-update-validation-${{ matrix.architecture }}.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.platform }}
          path: build/smoke
          if-no-files-found: ignore
      - name: Upload package
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perikop-${{ matrix.platform }}
          retention-days: ${{ env.NIGHTLY == 'true' && 1 || 0 }}
          path: build/package/Perikop-*
          if-no-files-found: error
          compression-level: 0
  windows-build:
    needs: [nightly]
    if: ${{ !cancelled() && ((github.event_name != 'schedule' && !inputs.nightly) || needs.nightly.outputs.build == 'true') }}
    runs-on: ubuntu-24.04
    env:
      PERIKOP_BUILD_VERSION: ${{ needs.nightly.outputs.version }}
    outputs:
      cross: ${{ steps.environment.outputs.cross }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for the pinned cross-build environment
        id: environment
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          assets = json.loads(Path('ci/dependencies-lock.json').read_text())['assets']
          print('cross=' + str('Windows-cross-environment.tar.gz' in assets).lower())
          PY
      - name: Cached dependency snapshots
        if: steps.environment.outputs.cross == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/downloads
          key: dependencies-Windows-cross-${{ hashFiles('ci/dependencies-lock.json') }}
      - name: Restore verified Windows sources and Linux toolchain
        if: steps.environment.outputs.cross == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "$PACKAGE" = true ] || [ "$GITHUB_EVENT_NAME" = pull_request ]; then args+=(--package); fi
          python3 tools/ci/dependencies.py restore --platform Windows --cross "${args[@]}"
      - name: Compiler cache
        if: steps.environment.outputs.cross == 'true'
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: objects-Windows-cross-${{ hashFiles('ci/upstreams.json', 'ci/windows-cross.Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            objects-Windows-cross-${{ hashFiles('ci/upstreams.json', 'ci/windows-cross.Dockerfile') }}-
            objects-Windows-cross-
      - name: Compile Windows x64 offline on Linux
        if: steps.environment.outputs.cross == 'true'
        run: |
          docker load --input build/ci/downloads/Windows-cross-environment.tar.gz
          docker run --rm --pull never --network none -v "$PWD:/work" -e PERIKOP_BUILD_VERSION \
            perikop-ci-windows-cross:dependencies bash tools/ci/build-windows-cross.sh
      - name: Save compiler cache after build failure
        if: always() && !cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Transfer binaries to Windows
        if: steps.environment.outputs.cross == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-build
          path: build/windows-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  windows:
    needs: [nightly, windows-build]
    if: ${{ !cancelled() && needs.windows-build.result == 'success' && ((github.event_name != 'schedule' && !inputs.nightly) || needs.nightly.outputs.build == 'true') }}
    runs-on: windows-2025
    env:
      WINDOWS_CROSS: ${{ needs.windows-build.outputs.cross }}
      PERIKOP_BUILD_VERSION: ${{ needs.nightly.outputs.version }}
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cached dependency snapshots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/downloads
          key: dependencies-${{ runner.os }}-${{ hashFiles('ci/dependencies-lock.json') }}
      - name: Restore verified dependencies from this repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $options = @()
          if ($env:WINDOWS_CROSS -eq 'true') {
            $options += '--tools-only'
          } elseif ($env:PACKAGE -eq 'true' -or $env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $options += '--package'
          }
          python tools/ci/dependencies.py restore --platform Windows @options
          if ($LASTEXITCODE -ne 0) { throw 'Dependency snapshot restore failed' }
          if ($env:WINDOWS_CROSS -ne 'true') {
            $bin = Join-Path $PWD 'build/ci/tools/w64devkit/bin'
            $gccVersion = & (Join-Path $bin 'g++.exe') -dumpfullversion -dumpversion
            if ($LASTEXITCODE -ne 0 -or $gccVersion -ne '15.2.0') { throw "Expected GCC 15.2.0, got $gccVersion" }
            $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            (Join-Path $PWD 'build/ci/tools/ccache') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            "ORTHO_TOOLCHAIN_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          (Join-Path $PWD 'build/ci/tools/nsis') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "NSISDIR=$(Join-Path $PWD 'build/ci/tools/nsis')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compiler cache
        if: needs.windows-build.outputs.cross != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: objects-${{ runner.os }}-${{ hashFiles('ci/upstreams.json') }}-${{ github.sha }}
          restore-keys: |
            objects-${{ runner.os }}-${{ hashFiles('ci/upstreams.json') }}-
            objects-${{ runner.os }}-${{ hashFiles('ci/dependencies-lock.json') }}-
            objects-${{ runner.os }}-
      - name: Download cross-built binaries
        if: needs.windows-build.outputs.cross == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-build
          path: build/cross
      - name: Restore cross-built binaries without recompiling
        if: needs.windows-build.outputs.cross == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/cmake | Out-Null
          tar -xzf build/cross/windows-x64.tar.gz -C build/cmake
          if ($LASTEXITCODE -ne 0) { throw 'Cross-built binary restore failed' }
      - name: Configure native test paths and installer
        shell: pwsh
        run: |
          # Keep the current CRT source. The prebuilt project needs no compiler or native sources.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $runtime = & $vswhere -latest -find 'VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\vcruntime140_1.dll' | Sort-Object | Select-Object -Last 1
          if (-not $runtime) { throw 'Visual C++ runtime not found' }
          if ($env:WINDOWS_CROSS -eq 'true') {
            cmake -S cmake/windows-prebuilt -B build/cmake -G Ninja "-DPERIKOP_MSVC_RUNTIME=$(Split-Path $runtime)"
          } else {
            cmake -S . -B build/cmake -G Ninja "-DPERIKOP_DEPENDENCY_DIR=$PWD/build/ci/sources" "-DCMAKE_C_COMPILER=$env:ORTHO_TOOLCHAIN_BIN/gcc.exe" "-DCMAKE_CXX_COMPILER=$env:ORTHO_TOOLCHAIN_BIN/g++.exe" "-DPERIKOP_MSVC_RUNTIME=$(Split-Path $runtime)" `
              -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DwxBUILD_PRECOMP=OFF
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows configuration failed' }
      - name: Compile on Windows until the cross-build snapshot is pinned
        if: needs.windows-build.outputs.cross != 'true'
        run: cmake --build build/cmake --parallel 4
      - name: Windows version and icon resources
        shell: pwsh
        run: |
          $header = Get-Content build/cmake/generated/perikop_version.hpp -Raw
          if ($header -notmatch '#define PERIKOP_VERSION "([^"]+)"') { throw 'Build version missing' }
          $expected = $Matches[1]
          $version = (Get-Item build/cmake/bin/perikop.exe).VersionInfo
          if ($version.FileDescription -ne 'Perikop' -or $version.ProductName -ne 'Perikop') {
            throw 'Executable must be named Perikop in Task Manager and file properties'
          }
          if ($version.ProductVersion -ne $expected -or $version.FileVersion -ne $expected) {
            throw "Executable version does not match $expected"
          }
          if (Test-Path build/cmake/bin/resources/icons) { throw 'Icon resources should be embedded' }
      - run: ctest --test-dir build/cmake --output-on-failure
      - name: Smoke test screenshots
        timeout-minutes: 10
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/smoke | Out-Null
          & build/cmake/bin/perikop.exe --smoke-test --resources build/cmake/bin/resources --screenshot "$PWD/build/smoke/reader.png" | Out-Host
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ runner.os }}
          path: build/smoke
          if-no-files-found: ignore
      - name: Package
        # PRs also compile the installer and check its Windows product-version metadata.
        if: env.PACKAGE == 'true' || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          & build/cmake/bin/perikop.exe --resources build/cmake/bin/resources --speech-probe "$PWD/build/voice-windows.wav" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Alice/Bjorn inference failed' }
          cpack --config build/cmake/CPackConfig.cmake -B build/package
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          $script = Get-Content build/package/_CPack_Packages/windows-x64/NSIS/project.nsi -Raw
          $languages = [regex]::Matches($script, '!insertmacro MUI_LANGUAGE "([^"]+)"')
          if ($languages.Count -ne 1 -or $languages[0].Groups[1].Value -ne 'Swedish') {
            throw 'Installer must include only the Swedish language'
          }
          $header = Get-Content build/cmake/generated/perikop_version.hpp -Raw
          if ($header -notmatch '#define PERIKOP_VERSION "([^"]+)"') { throw 'Build version missing' }
          $expected = $Matches[1]
          $installer = Get-ChildItem build/package/Perikop-*.exe | Select-Object -First 1
          if (-not $installer -or $installer.VersionInfo.ProductVersion -ne $expected) {
            throw "Installer version does not match $expected"
          }
          # Velopack: install the same files with Setup.exe, update them from a local feed, and uninstall.
          cmake --install build/cmake --prefix build/stage
          if ($LASTEXITCODE -ne 0) { throw 'Staging the installed files failed' }
          python tools/ci/velopack_windows_test.py build/stage/bin
          if ($LASTEXITCODE -ne 0) { throw 'Velopack install, update, and uninstall failed' }
      - name: Upload package
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perikop-Windows
          retention-days: ${{ env.NIGHTLY == 'true' && 1 || 0 }}
          path: build/package/Perikop-*.exe
          if-no-files-found: error
  sanitizers:
    needs: [nightly]
    if: ${{ !cancelled() && ((github.event_name != 'schedule' && !inputs.nightly) || needs.nightly.outputs.build == 'true') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cached dependency snapshots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/downloads
          key: dependencies-macOS-${{ hashFiles('ci/dependencies-lock.json') }}
      - name: Restore verified dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dependencies.py restore --platform macOS
      - name: Storage, speech, layout, and UI with ASan and UBSan
        timeout-minutes: 30
        run: sandbox-exec -p '(version 1)(allow default)(deny network*)' bash tools/ci/build-sanitizers.sh
  release:
    # Version tags require every check. Nightlies retain each successful platform package.
    if: ${{ !cancelled() && ((startsWith(github.ref, 'refs/tags/v') && needs.unix.result == 'success' && needs.windows.result == 'success' && needs.sanitizers.result == 'success') || (!startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'schedule' || inputs.nightly == true) && needs.nightly.outputs.build == 'true')) }}
    needs: [nightly, unix, windows, sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perikop-*
          path: packages
          merge-multiple: true
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          version=${GITHUB_REF_NAME#v}
          base=${version%%-*}
          # The packages carry the version from CMakeLists.txt, which must match the tag.
          shopt -s nullglob
          files=(Perikop-"$base"-*)
          if [ "${#files[@]}" != 5 ]; then
            echo "::error::The packages are not version $base. Set that version in CMakeLists.txt."
            exit 1
          fi
          if [ "$version" != "$base" ]; then
            for file in "${files[@]}"; do
              mv "$file" "Perikop-$version-${file#Perikop-"$base"-}"
            done
          fi
          sha256sum Perikop-* > SHA256SUMS.txt
          source="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Perikop $version" \
            --notes "See [the changes]($source/CHANGELOG.md) and [installation]($source/docs/using-perikop.md#installation)." \
            Perikop-* SHA256SUMS.txt
      - name: Publish nightly prerelease
        id: nightly
        if: env.NIGHTLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SANITIZERS: ${{ needs.sanitizers.result }}
          BUILD_VERSION: ${{ needs.nightly.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p packages
          day=$(TZ=Europe/Stockholm date +%F)
          tag="nightly-$day-${GITHUB_SHA:0:7}"
          # A retry of an incomplete nightly must not collide with its existing release.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            tag="$tag-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          tag=$(python3 tools/ci/nightly.py prepare --packages packages --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --tag "$tag" --sanitizers "$SANITIZERS" \
            --version "$BUILD_VERSION")
          if [ -z "$tag" ]; then
            echo 'No successful platform packages; no nightly was published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd packages
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Perikop nightly $day" \
            --notes-file NOTES.md \
            Perikop-* SHA256SUMS.txt
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # The in-app updater reads only the 10 newest releases. Keep at most nine nightlies so the
      # newest version is always among them; see docs/updating.md#feed-source.
      - name: Keep the latest seven nightly releases
        if: env.NIGHTLY == 'true' && steps.nightly.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.nightly.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          jq -r --arg current "$NIGHTLY_TAG" '
            [.[][] | select(.draft == false and .prerelease == true)
              | select(.tag_name | test("^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9a-f]{7}(-[0-9]+(-[0-9]+)?)?)?$"))]
            | if any(.tag_name == $current) then
                sort_by(.published_at, .tag_name) | reverse | .[7:] | .[].tag_name
              else error("Published nightly is missing; cleanup stopped") end
          ' releases.json > obsolete.txt
          while IFS= read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < obsolete.txt
