name: Speech evaluation metrics
on:
  pull_request:
    paths:
      - 'tools/speech/evaluation/**'
      - '.github/workflows/speech-evaluation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.1'
      - name: Check evaluation implementation (no ASR quality claim)
        run: >-
          uv run --no-project --python 3.12 --with numpy==2.3.5 python -m unittest
          discover -s tools/speech/evaluation -p '*_test.py' -v
