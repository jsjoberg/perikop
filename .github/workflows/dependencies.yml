name: Prepare CI dependencies
# Called from jsjoberg/perikop-assets, which publishes the snapshot as its own release. Keeping
# these prereleases out of this repository keeps its newest releases to nightlies and versions,
# which the in-app updater reads.
on:
  workflow_call:
    inputs:
      ref:
        description: The Perikop commit or branch whose pinned upstreams to prepare
        type: string
        required: true
      macos_tools_only:
        description: Rebuild macOS tools; reuse the pinned native inputs and Linux environment
        type: boolean
        default: false
      reuse_environments:
        description: Update native inputs; reuse the pinned Linux environment and macOS tools
        type: boolean
        default: false
      linux_environment_only:
        description: Rebuild the Linux environments; reuse the pinned Windows cross-build environment and macOS tools
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jsjoberg/perikop
          ref: ${{ inputs.ref }}
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - name: Download and verify pinned upstream inputs
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_TOOLS_ONLY: ${{ inputs.macos_tools_only }}
        run: |
          if [ "$MACOS_TOOLS_ONLY" = true ]; then
            python3 tools/ci/dependencies.py reuse --output build/snapshot
          else
            python3 tools/ci/dependencies.py upstream --output build/snapshot
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-inputs
          path: build/snapshot/inputs-*.tar.gz
          if-no-files-found: error
          compression-level: 0
  linux:
    strategy:
      matrix:
        include:
          - {os: ubuntu-24.04, platform: Linux}
          - {os: ubuntu-24.04-arm, platform: Linux-arm64}
    runs-on: ${{ matrix.os }}
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jsjoberg/perikop
          ref: ${{ inputs.ref }}
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - name: Prepare Linux toolchain and system libraries
        if: inputs.macos_tools_only != true && inputs.reuse_environments != true
        run: |
          docker build --pull -f ci/linux.Dockerfile -t perikop-ci-linux:dependencies ci
          mkdir -p build/snapshot
          docker run --rm --network none perikop-ci-linux:dependencies bash -c 'g++ --version && cmake --version && python3 --version && ccache --version'
          docker save perikop-ci-linux:dependencies | gzip -1 > "build/snapshot/$PLATFORM-environment.tar.gz"
      - name: Reuse pinned Linux environment
        if: inputs.macos_tools_only == true || inputs.reuse_environments == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dependencies.py reuse --platform "$PLATFORM" --output build/snapshot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-${{ matrix.platform }}
          path: build/snapshot/${{ matrix.platform }}-environment.tar.gz
          if-no-files-found: error
          compression-level: 0
  windows-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jsjoberg/perikop
          ref: ${{ inputs.ref }}
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - name: Prepare Linux toolchain for Windows x64
        if: inputs.macos_tools_only != true && inputs.reuse_environments != true && inputs.linux_environment_only != true
        run: |
          docker build --pull -f ci/windows-cross.Dockerfile -t perikop-ci-windows-cross:dependencies ci
          mkdir -p build/snapshot
          docker run --rm --network none perikop-ci-windows-cross:dependencies \
            bash -c 'x86_64-w64-mingw32-clang --version && cmake --version && ccache --version'
          docker save perikop-ci-windows-cross:dependencies | gzip -1 > build/snapshot/Windows-cross-environment.tar.gz
      - name: Reuse pinned cross-build environment
        if: inputs.macos_tools_only == true || inputs.reuse_environments == true || inputs.linux_environment_only == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dependencies.py reuse --platform Windows-cross --output build/snapshot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-windows-cross
          path: build/snapshot/Windows-cross-environment.tar.gz
          if-no-files-found: error
          compression-level: 0
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jsjoberg/perikop
          ref: ${{ inputs.ref }}
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - name: Prepare macOS analysis tools
        if: (inputs.reuse_environments != true && inputs.linux_environment_only != true) || inputs.macos_tools_only == true
        run: |
          brew install llvm@23 ccache
          mkdir -p build/snapshot
          python3 tools/ci/macos_tools.py build/snapshot
      - name: Reuse pinned macOS tools
        if: (inputs.reuse_environments == true || inputs.linux_environment_only == true) && inputs.macos_tools_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dependencies.py reuse --platform macOS --output build/snapshot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-macos
          path: build/snapshot/macOS-tools.tar.gz
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: [inputs, linux, windows-cross, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jsjoberg/perikop
          ref: ${{ inputs.ref }}
      - name: Set up Python tooling
        id: python
        uses: ./.github/actions/python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dependency-*
          path: build/snapshot
          merge-multiple: true
      - name: Publish dependency snapshot and its lock file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          tag="ci-dependencies-${commit:0:12}"
          python3 tools/ci/dependencies.py lock --output build/snapshot --repository "$GITHUB_REPOSITORY" --release "$tag"
          gh release create "$tag" build/snapshot/*.tar.gz build/snapshot/dependencies-lock.json \
            --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --title "CI dependencies ${commit:0:12}" \
            --notes "Prepared explicitly from the pinned upstreams at https://github.com/jsjoberg/perikop/commit/$commit. Commit dependencies-lock.json as ci/dependencies-lock.json in jsjoberg/perikop to activate this snapshot. Ordinary builds never fetch upstream inputs."
