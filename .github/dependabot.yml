# Dependabot cannot see the native dependencies: wxWidgets, SQLite and miniaudio
# are pinned URLs with hashes in CMake, and w64devkit, linuxdeploy
# and NSIS are pinned in ci/upstreams.json and tools/package_appimage.sh. Prepare
# a new CI dependency snapshot when those inputs or the build environment change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
